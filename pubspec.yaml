name: resaneh_media
description: Two independently installed private media archive apps for Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.6
  provider: ^6.1.5+1
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  file_picker: ^13.4.0
  receive_sharing_intent: ^1.9.0
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5
  open_filex: ^5.0.0
  video_player: ^2.14.1
  mime: ^2.1.0
  shamsi_date: ^1.1.1
  intl: ^0.20.3
  archive: ^4.7.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
